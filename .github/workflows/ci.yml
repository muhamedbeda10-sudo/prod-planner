name: CI

# The safety net for changes made straight on GitHub. Vercel already refuses to
# deploy code that does not compile, but it never runs the unit suite — so a
# change that quietly breaks a CALCULATION (tracker completion, OTD, the Excel
# import, delivery dates) would deploy happily and be wrong on screen. This job
# runs that suite on every change instead.
#
# No database needed: the domain tests are pure functions.
#
# Every run spends the account's monthly Actions minutes, so it runs once per
# change, not twice: a PR is checked on its own pushes, and the squash commit
# GitHub makes when it merges one — "Title (#123)", committed by web-flow, the
# code that PR already passed — is not checked again on master. Anything else
# pushed to master still is. Drafts are not checked, nor a push to master that
# changes Markdown alone.
on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# a newer push to the same branch makes the running check pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && !(github.event.head_commit.committer.username == 'web-flow' &&
        contains(github.event.head_commit.message, ' (#')))
    runs-on: ubuntu-latest
    # a stuck step must not burn the month's minutes
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not install) so the check runs against the locked versions,
      # exactly like a fresh machine would get
      - name: Install dependencies
        run: npm ci

      # a critical advisory against a shipped dependency (Next itself in 16.2.x)
      # must not reach production unnoticed; majors with a fix are reported, not blocked
      - name: Audit shipped dependencies for critical advisories
        run: npm audit --omit=dev --audit-level=critical

      # lib/server/* is typed against the generated Prisma client, so the types
      # have to exist before anything type-checks
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: AI reference evaluations — planning figures and assistant behaviour (no API key)
        run: npm run ai:eval
