name: Database backup

# The live database runs on Supabase's Pro plan, which takes a daily backup of
# its own and keeps 7 days of them (Database → Backups). Those only restore the
# whole project in place, over everything typed since, and live with the
# project — gone with it, out of reach without the Supabase account. This job
# is the backup kept outside Supabase (scripts/backup.mjs still dumps the old
# on-prem PostgreSQL only): every night
# a consistent pg_dump of the app's schema, sealed in a password-protected
# 7-Zip archive (AES-256, file names hidden too) and kept as a workflow
# artifact for BACKUP_KEEP_DAYS days. Downloading it needs read access to this
# private repository, and opening it needs the passphrase as well.
#
# Two repository secrets (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL — the address the app makes for its owner on Settings
#     → Database backup: the backup's own login, backup_reader, which reads
#     every table and changes nothing, through Supabase's Session pooler
#     (…pooler.supabase.com:5432). Any Session pooler address works too. Not
#     the direct db.<ref>.supabase.co address — it is IPv6-only and GitHub's
#     runners are not — and not the transaction pooler on 6543, which pg_dump
#     cannot use.
#   BACKUP_PASSPHRASE — a long passphrase kept somewhere other than GitHub.
#
# Restoring is in DEPLOY.md ("النسخ الاحتياطي").
on:
  schedule:
    # 00:40 UTC — 03:40 in Cairo in summer, 02:40 in winter: after the
    # evening shift, before the morning one
    - cron: "40 0 * * *"
  workflow_dispatch:

# never two dumps at once; a manual run waits for the nightly one
concurrency:
  group: database-backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  # pg_dump must be at least the server's major version (Supabase runs 17)
  PG_MAJOR: "17"
  BACKUP_KEEP_DAYS: "30"

jobs:
  dump:
    name: Dump, seal and keep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check the secrets are set
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the BACKUP_DATABASE_URL and BACKUP_PASSPHRASE repository secrets (see the top of this file)."
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 16 ]; then
            echo "::error::BACKUP_PASSPHRASE is too short — use at least 16 characters."
            exit 1
          fi

      - name: Dump the app's schema
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p out
          # the official image pins pg_dump to the server's major version;
          # only the public schema: the app's tables, its migration history
          # and the grants of the assistant's read-only login — Supabase's
          # own schemas are Supabase's to restore. The files attached in the
          # assistant's chat are kept a fortnight and are no record: their
          # table comes back empty.
          #
          # A few tries, spaced out: right after a login's password changes,
          # Supabase's pooler can still check it against the old one for a
          # moment — and many failed logins in a row would shut it out.
          for try in 1 2 3; do
            if docker run --rm --network host \
              -e BACKUP_DATABASE_URL \
              -e SKIP_DATA='public."AiFile"' \
              -v "$PWD/out:/out" \
              "postgres:${PG_MAJOR}" \
              sh -c 'pg_dump "$BACKUP_DATABASE_URL" --schema=public --exclude-table-data="$SKIP_DATA" --format=custom --compress=9 --no-owner --file=/out/atc.dump'; then
              break
            fi
            if [ "$try" -eq 3 ]; then
              echo "::error::pg_dump failed three times — see its message above."
              exit 1
            fi
            echo "pg_dump failed (try $try of 3) — trying again in $((try * 30)) seconds."
            rm -f out/atc.dump
            sleep $((try * 30))
          done
          # an archive pg_restore cannot list is not a backup
          docker run --rm -v "$PWD/out:/out" "postgres:${PG_MAJOR}" \
            pg_restore --list /out/atc.dump > out/contents.txt
          tables=$(grep -c " TABLE DATA public " out/contents.txt || true)
          size=$(stat -c %s out/atc.dump)
          echo "Dump: $size bytes, $tables tables with data."
          if [ "$tables" -lt 20 ] || [ "$size" -lt 50000 ]; then
            echo "::error::The dump looks incomplete ($tables tables, $size bytes) — not keeping it."
            exit 1
          fi

      - name: Seal it
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          command -v 7z > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q 7zip; }
          stamp=$(TZ=Africa/Cairo date +%Y-%m-%d_%H%M)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          # AES-256, the file list encrypted too (-mhe=on); 7-Zip opens it on
          # Windows with the same passphrase
          7z a -t7z -mhe=on -mx=0 -p"$BACKUP_PASSPHRASE" "atc-db-$stamp.7z" ./out/atc.dump > /dev/null
          rm -f out/atc.dump
          7z t -p"$BACKUP_PASSPHRASE" "atc-db-$stamp.7z" > /dev/null
          ls -l "atc-db-$stamp.7z"

      - name: Keep it
        uses: actions/upload-artifact@v4
        with:
          name: atc-db-${{ env.STAMP }}
          path: atc-db-${{ env.STAMP }}.7z
          retention-days: ${{ env.BACKUP_KEEP_DAYS }}
          if-no-files-found: error
          # already compressed by pg_dump, already encrypted
          compression-level: 0
